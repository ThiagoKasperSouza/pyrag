[project]
name = "pyrag"
version = "0.1.0"
description = "RAG com LLMs gratuitos, ferramentas agenticas e comunicacao A2A (LangChain + Python)"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-ollama>=0.2",
  "langchain-groq>=0.2",
  "langchain-google-genai>=2.0",
  "langchain-openai>=0.3",
  "langchain-chroma>=0.2",
  "chromadb>=0.5",
  "pypdf>=4.0",
  "fastembed>=0.4",
  "rank-bm25>=0.2",
  "duckduckgo-search>=6.3",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "tabulate>=0.9",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
pyrag = "pyrag.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
